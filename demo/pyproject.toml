[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-agent-harness"
version = "0.1.0"
description = "A small dependency-free agent harness for a local Ollama model"
requires-python = ">=3.10"

[project.scripts]
tiny-agent = "agent_harness.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_harness*"]
